[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nnapprox"
dynamic = ["version"]   
authors = [
  { name="Johannes Zierenberg", email="johannes.zierenberg@gmail.com" },
]
description = "Neural network approximation for high-dimensional functional relations"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
[tool.hatch.version]
path = "nnapprox/_version.py"


[project.optional-dependencies]
pytorch = [
    "torch>=1.9",
]
all = [
    "torch>=1.9",
    "cloudpickle>=2.0",
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "flake8>=4.0",
]

[project.urls]
Homepage = "https://github.com/zierenberg/nnapprox"
Issues = "https://github.com/zierenberg/nnapprox/issues"
Documentation = "https://nnapprox.readthedocs.io"